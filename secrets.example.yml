# secrets.example.yml — TEMPLATE ONLY. Copy to secrets.local.yml and fill in.
#
#   cp secrets.example.yml secrets.local.yml
#
# secrets.local.yml is gitignored and MUST NEVER be committed. In the AWS
# deployment these same keys live in a Secrets Manager JSON secret instead
# (set SIS_ENV=aws and SIS_AWS_SECRET_ID=<name>); the code path is identical.
#
# Flip adapters on once these are filled in:
#   export SIS_ADAPTERS=real     # default is "memory" (in-memory bus, no creds)

atlassian:
  base_url: https://your-site.atlassian.net
  email: you@example.com
  api_token: ATATT_replace_me            # id.atlassian.com → API tokens
  cloud_id: 00000000-0000-0000-0000-000000000000
  spec_space: SD                         # Confluence space key for specs
  proposal_space: PROPOSALS              # intake space for raw proposals
  charter_space: SD                      # space for the CEO's top-level charter
  jira_project: SD                       # Jira project key for epics/stories

github:
  token: ghp_replace_me                  # fine-grained PAT, repo-scoped
  owner: your-org-or-user
  repo: your-repo
  default_base: main

aws:
  region: us-east-1
  # secret_id is only used when SIS_ENV=aws (reading from Secrets Manager)
  secret_id: sis/prod/credentials
