# config.yml — every knob the engine has, with its default.
#
# GENERATED FROM sis/config.py. Do not hand-edit the structure: run
#     poetry run python -m sis.config --write
# after changing SCHEMA. Values may be edited; keys and comments may not.
#
# Precedence: CLI flag > environment variable > this file > built-in default.
#
# The prefix on each key is its protection tier, and it governs what a
# *human* may change through the operator UI — forbidden_ is not editable
# there at all, strict_ needs an explicit confirmation, soft_ is free. The
# self-improvement loop cannot write this file at any tier: it is
# POLICY-FORBIDDEN (sis/policy.py), like the gauntlet and the contracts.
#
# Secrets do NOT belong here — this file is committed. See secrets.example.yml.

brakes:
  # Hard cap on total LLM spend, in USD.
  # env: SIS_BUDGET_USD   flag: --brakes-budget-usd
  forbidden_budget_usd: 5.0
  # Consecutive failed cycles that trip the circuit breaker.
  # env: SIS_BREAKER_THRESHOLD   flag: --brakes-breaker-threshold
  forbidden_breaker_threshold: 3
  # Economics SLO: USD per accepted improvement before the loop is frozen.
  # env: SIS_MAX_COST_PER_ACCEPTED_USD   flag: --brakes-max-cost-per-accepted-usd
  forbidden_max_cost_per_accepted_usd: 2.0
  # Spend below which the economics SLO is not judged (too little signal).
  # env: SIS_SLO_MIN_SPEND_USD   flag: --brakes-slo-min-spend-usd
  forbidden_slo_min_spend_usd: 0.5
  # How much a correct-but-over-budget cycle (reject gate `slo`) adds to the
  # consecutive-failure streak; a correctness failure adds 1.0. In (0, 1].
  # env: SIS_SLO_FAILURE_WEIGHT   flag: --brakes-slo-failure-weight
  forbidden_slo_failure_weight: 0.5
  # Candidates a contract's held-out backtests may judge before the loop stops on it,
  # unless the contract declares its own holdout_budget (OMNI-207, D5). Counted per
  # held-out fixture from the episodic log; a new fixture starts at zero. Spent: a
  # neutral stop and a page, no spend.
  # env: SIS_HOLDOUT_BUDGET   flag: --brakes-holdout-budget
  forbidden_holdout_budget: 50
  # Fresh weeks a rotated held-out fixture needs at least (OMNI-225, D5): weeks after
  # the current held-out set's last, never judged. Fewer, and scripts/build_fixture.py
  # --rotate refuses and says when enough will be out.
  # env: SIS_HOLDOUT_ROTATION_MIN_WEEKS   flag: --brakes-holdout-rotation-min-weeks
  forbidden_holdout_rotation_min_weeks: 13
  # Whether a candidate judged again on the same held-out fixture uses another holdout
  # judgement, unless the contract declares its own holdout_count_repeats (OMNI-224).
  # Off: each candidate counts once, so the 'already built' re-check of a merged module
  # is free.
  # env: SIS_HOLDOUT_COUNT_REPEATS   flag: --brakes-holdout-count-repeats
  forbidden_holdout_count_repeats: false

sandbox:
  # Isolation for generated code: 'subprocess' (soft) or 'docker' (kernel-enforced,
  # --network none).
  # env: SIS_SANDBOX   flag: --sandbox-mode
  forbidden_mode: "subprocess"
  # Container image for the docker sandbox.
  # env: SIS_SANDBOX_IMAGE   flag: --sandbox-image
  forbidden_image: "sis-gauntlet:latest"
  # Memory ceiling for a docker-sandboxed gate.
  # env: SIS_SANDBOX_MEMORY   flag: --sandbox-memory
  forbidden_memory: "1g"
  # CPU ceiling for a docker-sandboxed gate.
  # env: SIS_SANDBOX_CPUS   flag: --sandbox-cpus
  forbidden_cpus: "2"
  # Wall-clock cap per gate — what contains an infinite loop in generated code.
  # env: SIS_GAUNTLET_TIMEOUT   flag: --sandbox-timeout-seconds
  forbidden_timeout_seconds: 120.0
  # Override the rule that a real (non-stub) proposer requires the docker sandbox. Lets
  # untrusted code read host files; for deliberate risk only.
  # env: SIS_ALLOW_UNSANDBOXED_LLM   flag: --sandbox-allow-unsandboxed-llm
  forbidden_allow_unsandboxed_llm: false

policy:
  # Repo-relative paths in the SOFT tier — the designated optimisation targets.
  # Guardrail paths always win over this list.
  # env: SIS_TARGET_PATHS   flag: --policy-target-paths
  forbidden_target_paths: ["runtime/target.py", "runtime/sort_target.py", "runtime/roman.py", "runtime/scenarios.py", "runtime/ca_price_persistence.py", "runtime/ca_price_wholesale.py"]
  # Let the loop propose changes to STRICT engine code (still requires human approval
  # and a justification).
  # env: SIS_ALLOW_STRICT_CHANGES   flag: --policy-allow-strict-changes
  forbidden_allow_strict_changes: false

episodic:
  # Episodic/provenance backend: 'jsonl', 'duckdb', or 'none'.
  # env: SIS_EPISODIC_STORE   flag: --episodic-store
  forbidden_store: "jsonl"

adapters:
  # 'memory' for in-process fakes, 'real' for Confluence/Jira/GitHub/AWS.
  # env: SIS_ADAPTERS   flag: --adapters-mode
  forbidden_mode: "memory"
  # Deployment: 'local' (file secrets) or 'aws' (Secrets Manager).
  # env: SIS_ENV   flag: --adapters-env
  forbidden_env: "local"
  # Path to the gitignored local secrets file.
  # env: SIS_SECRETS_FILE   flag: --adapters-secrets-file
  forbidden_secrets_file: "secrets.local.yml"
  # AWS region for Secrets Manager and cloud adapters.
  # env: SIS_AWS_REGION   flag: --adapters-aws-region
  forbidden_aws_region: "us-east-1"
  # Secrets Manager secret id (required when env=aws).
  # env: SIS_AWS_SECRET_ID   flag: --adapters-aws-secret-id
  forbidden_aws_secret_id: null
  # Per-request timeout for real-adapter HTTP calls.
  # env: SIS_HTTP_TIMEOUT   flag: --adapters-http-timeout-seconds
  soft_http_timeout_seconds: 30.0
  # SNS topic that pages the operator. Unset: pages are only recorded in memory, and a
  # real-adapter run warns that nobody will be paged.
  # env: SIS_NOTIFY_SNS_TOPIC_ARN   flag: --adapters-notify-sns-topic-arn
  forbidden_notify_sns_topic_arn: null
  # S3 bucket that receives the episodic log, the operator audit and the console log
  # under runs/<start time>/, while the loop runs and when it stops. Unset: nothing is
  # synced and nothing fails; the box's user_data sets it.
  # env: SIS_ARTIFACTS_BUCKET   flag: --adapters-artifacts-bucket
  forbidden_artifacts_bucket: null

proposer:
  # 'stub' for the offline hand-written candidate; anything else is a real LLM and is
  # treated as untrusted.
  # env: SIS_PROPOSER   flag: --proposer-backend
  strict_backend: "stub"
  # LLM vendor backing a real proposer.
  # env: SIS_LLM_PROVIDER   flag: --proposer-llm-provider
  strict_llm_provider: "anthropic"
  # Model id; unset uses the provider's default.
  # env: SIS_LLM_MODEL   flag: --proposer-llm-model
  strict_llm_model: null
  # Output token limit of one proposal, thinking included. An answer cut off at it is
  # not judged.
  # env: SIS_PROPOSER_OUTPUT_LIMIT   flag: --proposer-output-limit
  strict_output_limit: 16000
  # Output limit of the one retry a proposal cut off at output_limit gets. Cut off
  # again, the run stops.
  # env: SIS_PROPOSER_RETRY_OUTPUT_LIMIT   flag: --proposer-retry-output-limit
  forbidden_retry_output_limit: 32000
  # Programs the proposer may run on the training split before it submits, one per turn.
  # 0 turns the workbench off (one-shot proposals).
  # env: SIS_WORKBENCH_RUNS   flag: --proposer-workbench-runs
  forbidden_workbench_runs: 8
  # Wall time of one workbench run; a run past it is stopped.
  # env: SIS_WORKBENCH_RUN_SECONDS   flag: --proposer-workbench-run-seconds
  forbidden_workbench_run_seconds: 60.0
  # Characters of one run's output the proposer is shown; the rest is cut.
  # env: SIS_WORKBENCH_OUTPUT_CHARS   flag: --proposer-workbench-output-chars
  forbidden_workbench_output_chars: 6000
  # Wall time of a whole workbench conversation; past it, the proposer must answer.
  # env: SIS_WORKBENCH_WALL_SECONDS   flag: --proposer-workbench-wall-seconds
  forbidden_workbench_wall_seconds: 900.0
  # What one proposal with the workbench may spend, its answer included. Checked on a
  # worst case before each turn.
  # env: SIS_WORKBENCH_SPEND_USD   flag: --proposer-workbench-spend-usd
  forbidden_workbench_spend_usd: 1.5
  # Output limit of a workbench turn that may run code, thinking included. The answer
  # gets proposer.output_limit.
  # env: SIS_WORKBENCH_TURN_LIMIT   flag: --proposer-workbench-turn-limit
  forbidden_workbench_turn_limit: 8000

canary:
  # 'serve' judges the canary against real Ray Serve traffic; unset uses the legacy
  # in-memory recording.
  # env: SIS_CANARY   flag: --canary-backend
  strict_backend: null
  # In --loop mode, serve the head of develop as blue in a sandbox worker, deploy each
  # observed merge as green and judge it on shadow traffic from the contract's oracle: a
  # pass switches blue and green, a failure retires green, pages a human and opens a
  # revert PR (OMNI-133). Class-1 contracts only.
  # env: SIS_DEVELOP_BLUE_GREEN   flag: --canary-develop-blue-green
  strict_develop_blue_green: false

loop:
  # Seconds between cycles in --loop mode.
  # env: SIS_LOOP_INTERVAL   flag: --loop-interval-seconds
  soft_interval_seconds: 30.0
  # Stop after N cycles; unset runs until signalled.
  # env: SIS_LOOP_MAX_CYCLES   flag: --loop-max-cycles
  soft_max_cycles: null
  # Accepted steps a feature branch collects before its one PR to the base branch opens;
  # a step that finds no further gain ends the feature sooner (OMNI-130).
  # env: SIS_FEATURE_MAX_STEPS   flag: --loop-feature-max-steps
  soft_feature_max_steps: 3
  # Reviews a finished feature may have before it is given up (OMNI-131). Its PR opens
  # only after a review approves it; each review that asks for changes sends it back for
  # one revision. A feature still not approved after this many is a counted failure,
  # left on its branch with no PR. At least 1.
  # env: SIS_REVIEW_MAX_ROUNDS   flag: --loop-review-max-rounds
  soft_review_max_rounds: 3
  # Cycles in a row that found nothing to improve (no change, no gain) after which the
  # loop stops: the target has converged. An inconclusive benchmark resets the count
  # (OMNI-145). Not a breaker trip; nothing to reset (OMNI-138).
  # env: SIS_LOOP_CONVERGED_AFTER   flag: --loop-converged-after
  soft_converged_after: 3
  # Cycles between syncs of the run's episodic log, audit and console log to
  # adapters.artifacts_bucket; a killed process or a replaced box loses at most this
  # many. 0 syncs only when the loop stops (OMNI-140).
  # env: SIS_LOOP_ARTIFACT_SYNC_EVERY   flag: --loop-artifact-sync-every
  soft_artifact_sync_every: 1
  # What starts a cycle in --loop mode: 'repeat' runs the contract's canned proposal
  # every interval; 'model-error' runs one only when the predictor's scored error series
  # is in sustained breach of model_error.* (OMNI-197). The brakes, spend cap and
  # breaker apply either way.
  # env: SIS_LOOP_TRIGGER   flag: --loop-trigger
  strict_trigger: "repeat"

model_error:
  # Acceptable error: a window's mean absolute error above this, in the series' unit
  # (dollars per gallon for the California price), is an error-budget breach. A
  # sustained one pages and starts a cycle.
  # env: SIS_MODEL_ERROR_MAE_BUDGET   flag: --model-error-mae-budget
  strict_mae_budget: 0.15
  # How long: weeks the error may stay out of bounds before a cycle starts, counted in
  # whole windows that share no week (a spike never starts one).
  # env: SIS_MODEL_ERROR_BREACH_WEEKS   flag: --model-error-breach-weeks
  strict_breach_weeks: 8
  # Skill against climatology below this, sustained for breach_weeks, starts a cycle
  # without a page: headroom a code change could recover. 0 means no better than
  # climatology; below 1.
  # env: SIS_MODEL_ERROR_SKILL_FLOOR   flag: --model-error-skill-floor
  strict_skill_floor: 0.0
  # Weeks in one judged window, skipped weeks included.
  # env: SIS_MODEL_ERROR_WINDOW_WEEKS   flag: --model-error-window-weeks
  strict_window_weeks: 4
  # Scored weeks a window needs before it can be in breach; fewer is never a breach. At
  # most window_weeks.
  # env: SIS_MODEL_ERROR_MIN_WEEKS   flag: --model-error-min-weeks
  strict_min_weeks: 3

sensor:
  # 'sim' replays a canned trace, with no network; 'real' reads EIA's petroleum data as
  # scripts/capture_sensor.py captured it (OMNI-33). Passed to a consumer as an
  # argument, never read from the environment inside an actor.
  # env: SIS_SENSOR   flag: --sensor-backend
  forbidden_backend: "sim"

contracts:
  # Default contract name; --contract still overrides it per cycle.
  # env: SIS_CONTRACT   flag: --contracts-default
  soft_default: null

frontend:
  # Operator UI authentication: 'github' (OAuth) or 'none'. 'none' is refused unless the
  # UI is bound to loopback.
  # env: SIS_FRONTEND_AUTH   flag: --frontend-auth
  forbidden_auth: "github"
  # GitHub logins permitted to use the operator UI. Empty denies everyone: an allowlist
  # that defaults to 'anyone' only looks like a control.
  # env: SIS_FRONTEND_ALLOWED_LOGINS   flag: --frontend-allowed-logins
  forbidden_allowed_logins: []
  # Interface the operator UI listens on. Loopback by default; a public bind is what
  # makes 'auth: none' refuse to start.
  # env: SIS_FRONTEND_BIND   flag: --frontend-bind
  forbidden_bind: "127.0.0.1"
  # Port the operator UI listens on inside the container. TLS terminates in front of it
  # (see docs/OPERATOR_FRONTEND.md).
  # env: SIS_FRONTEND_PORT   flag: --frontend-port
  soft_port: 8080
