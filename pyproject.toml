# pyproject.toml — Poetry bootstrap for the self-improving server
# Run: poetry install   (then: poetry run python main.py)
#
# NOTE ON PYTHON BUILD: use the STANDARD CPython 3.14, not the free-threaded
# (python3.14t) build. Ray ships cp314 wheels but not cp314t (free-threaded)
# wheels yet, so a 3.14t env will fail to install Ray. Revisit free-threading
# once Ray publishes cp314t wheels.
#
# NOTE ON WINDOWS: Ray's published cp314 wheels target Linux and macOS-ARM. On a
# Windows machine, run this inside WSL2 (Ubuntu) for the smoothest path, or
# verify a win_amd64 cp314 wheel exists before relying on native Windows.

[project]
name = "self-improving-server"
version = "0.1.4"
description = "A self-improving server on a Ray actor hierarchy that generates, validates, and safely deploys its own code."
authors = [{ name = "Olaf Zumpe", email = "olaf.zumpe@gmail.com" }]
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dynamic = ["dependencies"]   # runtime deps declared in [tool.poetry.dependencies] below

[tool.poetry]
# Application, not a library to publish — don't package/install the root.
package-mode = false

[tool.poetry.dependencies]
ray = { version = "^2.55", extras = ["serve"] }
# Milestone 1 (the proposer stub) needs no API client. When you reach Milestone 2
# and want a real Claude call, add the SDK with its current version:
#   poetry add anthropic

[tool.poetry.group.dev.dependencies]
mypy = "^1.8"
pytest = "^8.0"
hypothesis = "^6.0"     # invariant gate: generation + shrinking (also in Dockerfile.gauntlet)
pytest-xdist = "^3.6"   # -n auto; the suite is subprocess-heavy, not CPU-bound
ruff = "^0.6"

# Real-world adapters (Confluence/Jira/GitHub/AWS). Optional: the default
# in-memory adapters need none of these. Install with:
#   poetry install --with real
[tool.poetry.group.real]
optional = true

[tool.poetry.group.real.dependencies]
requests = "^2.32"      # Atlassian + GitHub REST
boto3 = "^1.35"         # AWS Secrets Manager + infra
pyyaml = "^6.0"         # secrets.local.yml parsing

# Real Claude proposer (Milestone 2). Optional: the default stub proposer
# needs no SDK or API key. Install with: poetry install --with llm
[tool.poetry.group.llm]
optional = true

[tool.poetry.group.llm.dependencies]
anthropic = ">=0.69,<1.0"   # Claude API client for the real proposer; ^0.x pins one patch release

# Episodic-store analytics backend (DuckDB). Optional: the default jsonl store
# needs nothing. Install with: poetry install --with analytics
[tool.poetry.group.analytics]
optional = true

[tool.poetry.group.analytics.dependencies]
duckdb = "^1.1"         # embedded analytical store for the episodic log

# Optional extras (only present with their groups); don't fail mypy when absent.
[[tool.mypy.overrides]]
module = ["yaml", "boto3", "requests", "requests.*", "anthropic", "duckdb"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# --- Tooling config, aligned with the design's "gate hard" rules ---

[tool.mypy]
python_version = "3.14"
strict = true                # generated code must be fully typed; this is a gauntlet gate
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default is the *inner-loop* run: everything except the Ray Serve
# integration tests, in parallel. Those are ~8-14s each because they stand up a
# real cluster, deploy real Serve applications and drive real HTTP traffic —
# which is the point of them (OMNI-13's blue-replica restart was invisible to
# anything less), but it makes them the wrong thing to pay for on every save.
#
# `-m "not serve"` here means a bare `pytest` is NOT a full verification, so
# conftest.py prints a loud reminder whenever it skips them, and CI runs both
# halves explicitly. That combination is deliberate: this repo has already been
# bitten once by a green tick that verified nothing (OMNI-16), and a default
# that silently narrows what "passing" means is exactly that shape.
addopts = "-q -m 'not serve' -n auto"
markers = [
    "serve: stands up a real Ray Serve deployment. Slow, excluded from the default run, always run in CI.",
]

[tool.ruff]
line-length = 100
target-version = "py313"   # ruff 0.6 has no py314 yet; py313 lints are 3.14-safe

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # errors, pyflakes, import-sort, pyupgrade, bugbear
