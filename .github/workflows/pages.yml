name: Landing page

# OMNI-229: publishes site/ to GitHub Pages once it has landed on develop.
# The page is static: index.html, style.css, app.js and data/site.json, which
# scripts/export_site_data.py writes through sis/site_export.py (the door that
# refuses a licensed series). The fast suite checks the committed data on every
# PR (tests/test_site_export.py), so nothing here needs the engine installed.
on:
  push:
    branches: [develop]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
