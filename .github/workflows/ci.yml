name: CI

# The same gates the gauntlet enforces on generated code, run on every push/PR
# against the engine. Wire this as a required status check in branch protection
# so nothing merges to main without passing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py314-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction   # core + dev (ray, mypy, pytest, ruff)

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: mypy --strict (type gate)
        run: poetry run mypy --strict sis/ main.py scripts/

      - name: pytest (test gate)
        run: poetry run pytest -q
