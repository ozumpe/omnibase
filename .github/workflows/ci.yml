name: CI

# The same gates the gauntlet enforces on generated code, run on every push/PR
# against the engine. Wire this as a required status check in branch protection
# so nothing merges to main without passing.
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py314-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction   # core + dev (ray, mypy, pytest, ruff)

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: mypy --strict (type gate)
        run: poetry run mypy --strict sis/ main.py scripts/

      # Two halves, both required. The default addopts exclude the `serve`
      # marker and parallelise, which is right for the inner loop and wrong for
      # a verification gate — so CI runs the excluded half explicitly rather
      # than inheriting a narrowed definition of "passing" (OMNI-16).
      # tests/test_test_layout.py pins that this file keeps doing so.
      - name: pytest (test gate)
        run: poetry run pytest -q

      - name: pytest (Ray Serve integration gate)
        # Serial by design: these bind a fixed port and share one Ray cluster,
        # so -n auto would have them fight over both. `-n 0` rather than
        # `-p no:xdist`, which would disable the plugin while addopts still
        # passes it `-n auto` — an unrecognised-argument error, not a serial run.
        run: poetry run pytest -q -m serve -n 0
